[package]
name = "launcher-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "launcher_core"
path = "src/lib.rs"

[[bin]]
name = "launch-cli"
path = "src/bin/launch_cli.rs"

[dependencies]
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = { package = "sha1", version = "0.10" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
uuid = { version = "1", features = ["v4", "v5"] }
hex = "0.4"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
url = "2"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
